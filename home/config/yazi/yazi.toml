[mgr]
ratio          = [1, 3, 4]

sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true

show_hidden    = true
show_symlink   = true

[preview]
tab_size      = 2

max_width     = 1000
max_height    = 1000

image_filter  = "lanczos3"
image_quality = 90
image_delay   = 30

[opener]
edit = [
    { run = 'nvim "$@"', block = true, for = "unix" }
]
